appId: host.exp.exponent
---
# Assumimos que o login já foi feito e estamos na tela principal

# Confirma que estamos na tela principal com a licença criada
- assertVisible:
    id: "addButton"

# Toca no card da licença criada para abrir os detalhes
- tapOn: "Projeto E2E Maestro"
- waitForAnimationToEnd

# Verifica que a tela de detalhe abriu com os dados corretos
- assertVisible: "Projeto E2E Maestro"
- assertVisible: "IBAMA"
- assertVisible: "LO"

# Volta para a tela principal
- tapOn: "Voltar"
- waitForAnimationToEnd

# Confirma que voltamos à lista principal
- assertVisible:
    id: "addButton"
