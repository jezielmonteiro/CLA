appId: host.exp.exponent
---
# Assumimos que estamos na tela principal com a lista de licenças
- assertVisible: "Projeto E2E Maestro"

# Desliza a licença para a esquerda para revelar os botões de ação (Editar e Excluir)
- swipe:
    direction: LEFT
    element: "Projeto E2E Maestro"

# Clica no botão de Editar
- tapOn: "Editar"

# Aguarda a tela de formulário abrir
- waitForAnimationToEnd

# Agora na tela de formulário, vamos editar o campo de Condicionantes / Observações
- tapOn: "Descreva as condicionantes ou restrições pendentes..."
# Apaga o texto anterior e escreve o novo
- eraseText
- inputText: "Com condicionantes pendentes"

- hideKeyboard
- waitForAnimationToEnd

# Scroll down para garantir que o botão Salvar esteja visível
- scrollUntilVisible:
    element:
      id: "saveLicenseButton"
    direction: DOWN
    timeout: 5000

# Clica em Salvar Licença
- tapOn:
    id: "saveLicenseButton"
- waitForAnimationToEnd

# Se houver um diálogo de debug (como o popup "DEBUG FORM SALVAR"), clica em OK para prosseguir
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd

# Aguarda voltar para a tela principal (esperando o Firestore e a transição)
- extendedWaitUntil:
    visible:
      id: "addButton"
    timeout: 10000

# Verifica se voltamos para a lista principal
- assertVisible: "Projeto E2E Maestro"
